version: '3.8'

services:
  saga-orchestrator-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saga_orchestrator
      POSTGRES_USER: saga_user
      POSTGRES_PASSWORD: saga_pass
    ports:
      - '5436:5432'

  saga-orchestrator:
    build: .
    restart: on-failure
    environment:
      PORT: 3020
      DATABASE_URL: postgresql://saga_user:saga_pass@saga-orchestrator-db:5432/saga_orchestrator?schema=public
      # Sibling services; reach them via the host when each microservice runs
      # from its own docker-compose file.
      OS_SERVICE_URL: http://host.docker.internal:3010/api/v1
      BILLING_SERVICE_URL: http://host.docker.internal:3001/api/v1
      RABBITMQ_URL: amqp://guest:guest@host.docker.internal:5672
      EXECUTION_SAGA_EXCHANGE: workshop.saga
      # Billing/Execution are owned by other teams; flip to 'false' once
      # they're running alongside this service to use the real adapters
      # above instead of the in-process mocks.
      USE_MOCK_DOWNSTREAM: 'true'
    depends_on:
      - saga-orchestrator-db
    ports:
      - '3020:3020'
